schema_version: "1.0"
project:
  id: buildmap
  name: BuildMap
  type: web-application
  repository_root: "."
  baseline_branch: main
inherits: [nextjs-supabase]
technology:
  languages: [typescript, sql, python]
  frameworks: [nextjs, supabase]
  database:
    engine: postgresql
scope:
  include: ["src/**", "supabase/**", "scripts/**", "tests/**", "docs/**"]
  exclude: ["node_modules/**", ".next/**", "output/**"]
protected_paths: []
commands:
  baseline: ["pnpm test"]
  integration: ["supabase db reset"]
review:
  packs:
    - universal.test-completeness
    - application.authorization
    - data.rls
    - data.migration-safety
    - runtime.retries-idempotency
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: true
    regression_tests: true
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false

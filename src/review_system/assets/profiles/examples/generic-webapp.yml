schema_version: "1.0"
project:
  id: generic-webapp
  name: Generic Web Application
  type: web-application
  repository_root: "."
  baseline_branch: main
inherits:
  - nextjs-supabase
technology:
  languages: [typescript, sql]
  frameworks: [nextjs, supabase]
  database:
    engine: postgresql
scope:
  include: ["src/**", "app/**", "supabase/**"]
  exclude: ["node_modules/**", ".next/**", "generated/**"]
protected_paths: []
commands:
  baseline: ["pnpm test", "pnpm build"]
  integration: ["supabase db reset"]
review:
  packs:
    - universal.architecture
    - universal.requirements-traceability
    - universal.test-completeness
    - application.authentication
    - application.authorization
    - data.rls
    - data.migration-safety
    - data.relational-integrity
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: true
    regression_tests: true
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false

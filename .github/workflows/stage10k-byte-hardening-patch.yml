name: Stage 10K byte hardening patch
on:
  push:
    branches:
      - agent/stage-10k-review-packet-byte-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-10k-review-packet-byte-hardening
      - name: Apply canonical packet-byte hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          review = "src/review_system/trust_prospective_review.py"
          replace_once(
              review,
              '    payload = (json.dumps(packet, indent=2, ensure_ascii=False) + "\\n").encode("utf-8")\n',
              '    payload = (json.dumps(packet, indent=2, ensure_ascii=False, sort_keys=True) + "\\n").encode("utf-8")\n',
          )
          replace_once(
              review,
              '    try:\n        value = json.loads(source.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as exc:\n        raise ProspectiveReviewError(f"cannot load prospective review packet: {exc}") from exc\n    errors = verify_review_packet_data(value)\n',
              '    try:\n        raw = source.read_bytes()\n        value = json.loads(raw.decode("utf-8"))\n    except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise ProspectiveReviewError(f"cannot load prospective review packet: {exc}") from exc\n    canonical = (json.dumps(value, indent=2, ensure_ascii=False, sort_keys=True) + "\\n").encode("utf-8")\n    if raw != canonical:\n        raise ProspectiveReviewVerificationError(["packet byte representation is not canonical"])\n    errors = verify_review_packet_data(value)\n',
          )

          mutation = "src/review_system/trust_prospective_mutation.py"
          replace_once(
              mutation,
              '    try:\n        packet = json.loads(source.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as exc:\n        raise ProspectiveEvidenceError(f"cannot load governed prospective review packet archive: {exc}") from exc\n    if not isinstance(packet, dict):\n',
              '    try:\n        raw = source.read_bytes()\n        packet = json.loads(raw.decode("utf-8"))\n    except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise ProspectiveEvidenceError(f"cannot load governed prospective review packet archive: {exc}") from exc\n    canonical = (json.dumps(packet, indent=2, ensure_ascii=False, sort_keys=True) + "\\n").encode("utf-8")\n    if raw != canonical:\n        raise ProspectiveEvidenceError("governed prospective review packet archive byte representation is not canonical")\n    if not isinstance(packet, dict):\n',
          )

          tests = "tests/test_trust_prospective_review_hardening.py"
          replace_once(tests, 'from copy import deepcopy\n', 'from copy import deepcopy\nimport json\n')
          marker = '''    def test_semantic_rehash_forgery_is_rejected_by_exact_source_replay(self):\n'''
          addition = '''    def test_formatting_only_packet_byte_mutation_cannot_create_review_authority(self):\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            _fixture, source, _candidate, candidate_path, workspace, _intake, packet, packet_path = self._case(root)\n            before = (workspace / "comparison-registry.json").read_bytes()\n            packet_path.write_text(\n                json.dumps(packet, indent=4, ensure_ascii=False, sort_keys=False) + "\\n",\n                encoding="utf-8",\n            )\n            with self.assertRaisesRegex(ProspectiveReviewVerificationError, "byte representation is not canonical"):\n                submit_review_packet(\n                    packet_path,\n                    workspace_root=workspace,\n                    github_candidate=candidate_path,\n                    repository_root=root,\n                    github_cli=object(),\n                    review_level="REVIEWED",\n                    decision="APPROVE",\n                    actor="reviewer-a",\n                    occurred_at=REVIEW_AT,\n                    confirmed_risk_band="R0",\n                    collect_pr=lambda *args, **kwargs: (deepcopy(source), None),\n                )\n            self.assertEqual(before, (workspace / "comparison-registry.json").read_bytes())\n\n'''
          replace_once(tests, marker, addition + marker)

          replace_once(
              "docs/architecture/STAGE-10K-GOVERNED-PROSPECTIVE-REVIEW-HANDOFF.md",
              '`packet_id` is deterministic from the governed assessment/GitHub/evidence snapshot identity. `packet_sha256` is a canonical JSON semantic hash of the packet excluding its own hash field. The on-disk writer emits one deterministic formatted representation, while semantic verification and authoritative source replay prevent changed packet meaning from creating review authority.\n',
              '`packet_id` is deterministic from the governed assessment/GitHub/evidence snapshot identity. `packet_sha256` is a canonical JSON semantic hash of the packet excluding its own hash field. In addition, Stage 10K requires one canonical on-disk byte representation: UTF-8 JSON, recursively sorted object keys, two-space indentation, and one terminal newline. Formatting/key-order byte drift is rejected before review authority can be created, while semantic verification and authoritative source replay separately prevent changed packet meaning plus recomputed hashes from creating review authority.\n',
          )
          replace_once(
              "docs/architecture/STAGE-10K-IMPLEMENTATION-REVIEW.md",
              'The current hash contract is canonical semantic JSON, not a second hash over whitespace/key-order serialization. The packet writer emits deterministic JSON formatting; semantically modified packet bytes are covered, while formatting-only reserialization is normalized by the canonical semantic identity rather than treated as a different safety snapshot.\n',
              'The hash contract remains canonical semantic JSON, while the file contract adds an independent canonical byte representation: UTF-8, recursively sorted object keys, two-space indentation, and one terminal newline. `load_review_packet()` and the archived-packet mutation guard both reject any non-canonical byte representation before review authority can be created. This separates literal packet-byte tamper protection from semantic-rehash protection.\n',
          )
          replace_once(
              "docs/architecture/STAGE-10K-VALIDATION.md",
              'The packet hash is canonical semantic JSON. The deterministic writer fixes the normal on-disk representation; validation treats whitespace/key-order-only reserialization as the same semantic packet rather than as a new evidence snapshot. Changed governed meaning is protected both by `packet_sha256` and by source reconstruction.\n',
              'The packet hash is canonical semantic JSON, and the on-disk packet has an independent canonical byte contract: UTF-8, recursively sorted object keys, two-space indentation, and one terminal newline. Whitespace/key-order-only reserialization therefore fails before review authority creation. Changed governed meaning is separately protected by `packet_sha256` and authoritative source reconstruction, including semantic rehash forgery attempts.\n',
          )
          PY
      - name: Remove temporary patch workflow
        run: rm .github/workflows/stage10k-byte-hardening-patch.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage10k): bind review authority to canonical packet bytes"
          git push origin HEAD:agent/stage-10k-review-packet-byte-hardening

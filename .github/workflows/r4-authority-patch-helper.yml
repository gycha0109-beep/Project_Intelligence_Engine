name: R4 authority patch helper

on:
  push:
    branches:
      - ops/r4-authority-patch-helper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mirrored schema exactly
        shell: bash
        run: |
          set -euo pipefail
          target='feat/trust-r4-semantic-authority'
          git fetch origin "$target"
          git checkout -B "$target" "origin/$target"
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('schemas/trust-report.schema.json')
          schema = json.loads(path.read_text(encoding='utf-8'))
          versions = schema['properties']['risk_model_version']['enum']
          if versions != ['1.1', '1.2']:
              raise SystemExit(f'unexpected mirrored risk model enum: {versions!r}')
          schema['properties']['risk_model_version']['enum'] = ['1.1', '1.2', '1.3']
          evidence_props = schema['$defs']['evidence']['properties']
          if 'r4_semantics' in evidence_props:
              raise SystemExit('mirrored r4_semantics already present')
          evidence_props['r4_semantics'] = {'type': 'object'}
          path.write_text(
              json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'PIE R4 authority promotion'
          git config user.email 'actions@users.noreply.github.com'
          git add -- schemas/trust-report.schema.json
          git diff --cached --check
          git commit -m 'feat(trust): mirror Trust v1.3 report schema'
          git push origin HEAD:"$target"

name: R4 authority patch helper

on:
  push:
    branches:
      - ops/r4-authority-patch-helper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove authority import cycle exactly
        shell: bash
        run: |
          set -euo pipefail
          target='feat/trust-r4-semantic-authority'
          git fetch origin "$target"
          git checkout -B "$target" "origin/$target"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/review_system/trust_r4_semantics_authority.py')
          text = path.read_text(encoding='utf-8')
          old = '''from .trust_r4_semantics_shadow import (
    CLASSIFICATIONS,
    CONTRACT_VERSION,
    analyze_r4_semantics,
)
from .workflow_semantics import split_git_diff_by_path


TRUST_R4_SEMANTIC_EVIDENCE_SCHEMA_VERSION = "1.0"
'''
          new = '''from .workflow_semantics import split_git_diff_by_path


CONTRACT_VERSION = "TRUST_R4_SEMANTIC_UNDERDETECTION_SHADOW_V1"
CLASSIFICATIONS = (
    "NORMATIVE_DECISION_AUTHORITY",
    "EXECUTABLE_VERIFICATION_GATE_AUTHORITY",
    "SUPPORTING_EVALUATION_ONLY",
    "SUPPORTING_REGRESSION_ONLY",
    "UNKNOWN",
)
TRUST_R4_SEMANTIC_EVIDENCE_SCHEMA_VERSION = "1.0"
'''
          if text.count(old) != 1:
              raise SystemExit('authority import replacement mismatch')
          text = text.replace(old, new, 1)
          old_loop = '''    analyses: list[dict[str, Any]] = []
    for path in files:
        patch = sections[path]
        analysis = analyze_r4_semantics(path, patch)
'''
          new_loop = '''    # Lazy import avoids trust -> authority -> shadow -> trust import cycles while
    # preserving the exact shadow-calibrated analyzer as the single implementation.
    from .trust_r4_semantics_shadow import analyze_r4_semantics

    analyses: list[dict[str, Any]] = []
    for path in files:
        patch = sections[path]
        analysis = analyze_r4_semantics(path, patch)
'''
          if text.count(old_loop) != 1:
              raise SystemExit('authority analyzer replacement mismatch')
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -c 'import review_system.trust; import review_system.trust_r4_semantics_authority'
          git config user.name 'PIE R4 authority promotion'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/review_system/trust_r4_semantics_authority.py
          git diff --cached --check
          git commit -m 'fix(trust): avoid R4 authority import cycle'
          git push origin HEAD:"$target"

name: PIE Operational Review Action

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact target repository in owner/name form.
        required: true
        type: string
      pull_request_number:
        description: Exact open target pull request number.
        required: true
        type: number
      decision:
        description: Explicit human review decision.
        required: true
        type: choice
        options:
          - APPROVE
          - REQUEST_CHANGES
          - HOLD
          - REJECT
          - RECLASSIFY
      reason:
        description: Explicit human reason recorded with the governed review event.
        required: true
        type: string
      confirmed_risk_band:
        description: Required only for RECLASSIFY; leave NONE for other decisions.
        required: true
        default: NONE
        type: choice
        options:
          - NONE
          - R0
          - R1
          - R2
          - R3
          - R4

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pie-orl4-${{ inputs.target_repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Record explicit governed review
    runs-on: ubuntu-latest
    steps:
      - name: Validate authority and explicit inputs
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          AUTHORITY_REVISION: ${{ github.sha }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_DECISION: ${{ inputs.decision }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_CONFIRMED_RISK: ${{ inputs.confirmed_risk_band }}
          REVIEW_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          failures = []
          sha40 = re.compile(r"^[0-9a-fA-F]{40}$")
          decisions = {"APPROVE", "REQUEST_CHANGES", "HOLD", "REJECT", "RECLASSIFY"}
          bands = {"NONE", "R0", "R1", "R2", "R3", "R4"}

          if os.environ["EVENT_REPOSITORY"].lower() != os.environ["AUTHORITY_REPOSITORY"].lower():
              failures.append("AUTHORITY_BINDING_FAILED: workflow repository is not the PIE authority repository")
          if os.environ["EVENT_REF"] != "refs/heads/main":
              failures.append("AUTHORITY_BINDING_FAILED: ORL-4 must be dispatched from PIE main")
          if not sha40.fullmatch(os.environ["AUTHORITY_REVISION"]):
              failures.append("AUTHORITY_BINDING_FAILED: workflow revision must be an exact Git SHA")

          repository = os.environ["INPUT_REPOSITORY"].strip()
          if repository.count("/") != 1 or repository.startswith("/") or repository.endswith("/"):
              failures.append("INVALID_INPUT: target_repository must be owner/name")
          pr_number = os.environ["INPUT_PR_NUMBER"].strip()
          if not pr_number.isdigit() or int(pr_number) < 1:
              failures.append("INVALID_INPUT: pull_request_number must be positive")
          decision = os.environ["INPUT_DECISION"].strip().upper()
          if decision not in decisions:
              failures.append("INVALID_INPUT: decision is not canonical")
          reason = os.environ["INPUT_REASON"].strip()
          if not reason or len(reason) > 1000:
              failures.append("INVALID_INPUT: reason must contain 1-1000 characters")
          band = os.environ["INPUT_CONFIRMED_RISK"].strip().upper()
          if band not in bands:
              failures.append("INVALID_INPUT: confirmed_risk_band is invalid")
          if decision == "RECLASSIFY" and band == "NONE":
              failures.append("INVALID_INPUT: RECLASSIFY requires confirmed_risk_band R0-R4")
          if decision != "RECLASSIFY" and band != "NONE":
              failures.append("INVALID_INPUT: confirmed_risk_band is only allowed for RECLASSIFY")
          if not os.environ["REVIEW_ACTOR"].strip():
              failures.append("INVALID_INPUT: github.actor is empty")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Resolve live target PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repository = os.environ["INPUT_REPOSITORY"].strip()
          pr_number = int(os.environ["INPUT_PR_NUMBER"])
          proc = subprocess.run(
              ["gh", "api", f"repos/{repository}/pulls/{pr_number}"],
              check=True,
              text=True,
              capture_output=True,
          )
          pr = json.loads(proc.stdout)
          if str(pr.get("state") or "").lower() != "open":
              raise SystemExit("TARGET_BINDING_FAILED: target pull request must remain open")
          head = str((pr.get("head") or {}).get("sha") or "").lower()
          base = str((pr.get("base") or {}).get("sha") or "").lower()
          if re.fullmatch(r"[0-9a-f]{40}", head) is None or re.fullmatch(r"[0-9a-f]{40}", base) is None:
              raise SystemExit("TARGET_BINDING_FAILED: target PR does not expose exact head/base SHAs")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"head={head}\n")
              handle.write(f"base={base}\n")
          PY

      - name: Checkout exact target PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: refs/pull/${{ inputs.pull_request_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target checkout
        env:
          LIVE_HEAD: ${{ steps.target.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head,,}" != "${LIVE_HEAD,,}" ]]; then
            echo "STALE_SOURCE_REVISION: live=${LIVE_HEAD} checked_out=${actual_head}" >&2
            exit 4
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "SOURCE_MISMATCH: checked-out target worktree is not clean" >&2
            exit 4
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact PIE authority revision
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          AUTHORITY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/${AUTHORITY_REPOSITORY}.git@${AUTHORITY_REVISION}"
          pie-trust-prospective submit-operational-review --help >/dev/null

      - name: Record explicit governed review action
        id: action
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_DECISION: ${{ inputs.decision }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_CONFIRMED_RISK: ${{ inputs.confirmed_risk_band }}
          REVIEW_ACTOR: ${{ github.actor }}
          LIVE_HEAD: ${{ steps.target.outputs.head }}
          LIVE_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/pie-orl4-result.json"
          cache_root="${RUNNER_TEMP}/pie-orl4-cache"
          action_file="${RUNNER_TEMP}/pie-orl4/action.json"
          mkdir -p "$(dirname "${action_file}")"

          args=(
            submit-operational-review
            --target-repository "${INPUT_REPOSITORY}"
            --pull-request "${INPUT_PR_NUMBER}"
            --repository-root "${GITHUB_WORKSPACE}"
            --artifact-cache-root "${cache_root}"
            --decision "${INPUT_DECISION}"
            --reason "${INPUT_REASON}"
            --actor "${REVIEW_ACTOR}"
            --output "${action_file}"
          )
          if [[ "${INPUT_CONFIRMED_RISK}" != "NONE" ]]; then
            args+=(--confirmed-risk-band "${INPUT_CONFIRMED_RISK}")
          fi
          pie-trust-prospective "${args[@]}" > "${result_file}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          result_path = Path(os.environ["RUNNER_TEMP"]) / "pie-orl4-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("valid") is not True:
              raise SystemExit("ORL4_INTERNAL_ERROR: action command did not return valid=true")
          if result.get("status") != "HUMAN_REVIEW_RECORDED":
              raise SystemExit("ORL4_BOUNDARY_ERROR: action did not record HUMAN_REVIEW_RECORDED")

          source = result.get("source", {})
          pr = source.get("pull_request", {})
          review = result.get("review", {})
          authority = result.get("authority", {})
          if str(source.get("repository", {}).get("name_with_owner") or "").lower() != os.environ["INPUT_REPOSITORY"].lower():
              raise SystemExit("ORL4_SOURCE_ERROR: repository mismatch")
          if pr.get("number") != int(os.environ["INPUT_PR_NUMBER"]):
              raise SystemExit("ORL4_SOURCE_ERROR: PR number mismatch")
          if pr.get("head_oid") != os.environ["LIVE_HEAD"].lower() or pr.get("base_oid") != os.environ["LIVE_BASE"].lower():
              raise SystemExit("ORL4_SOURCE_ERROR: head/base mismatch")
          if review.get("decision") != os.environ["INPUT_DECISION"]:
              raise SystemExit("ORL4_SOURCE_ERROR: decision mismatch")
          if review.get("actor") != os.environ["REVIEW_ACTOR"]:
              raise SystemExit("ORL4_SOURCE_ERROR: actor mismatch")
          if review.get("reason") != os.environ["INPUT_REASON"].strip():
              raise SystemExit("ORL4_SOURCE_ERROR: reason mismatch")
          if authority.get("human_review_recorded") is not True:
              raise SystemExit("ORL4_AUTHORITY_ERROR: human review was not recorded")
          for field in (
              "outcome_recorded",
              "automation_authorized",
              "pilot_authorized",
              "merge_authorized",
              "deploy_authorized",
              "production_effect_authorized",
          ):
              if authority.get(field) is not False:
                  raise SystemExit(f"ORL4_AUTHORITY_ERROR: {field} must remain false")

          event_id = str(result.get("event", {}).get("event_id") or "")
          action_hash = str(result.get("action_sha256") or "")
          if re.fullmatch(r"event-[0-9a-f]{32}", event_id) is None:
              raise SystemExit("ORL4_EVIDENCE_ERROR: event_id is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", action_hash) is None:
              raise SystemExit("ORL4_EVIDENCE_ERROR: action_sha256 is invalid")

          action_file = Path(result["action_file"]).resolve()
          bridge_root = Path(result["bridge_root"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          for path, label in ((action_file, "action"), (bridge_root, "bridge")):
              try:
                  path.relative_to(runner_temp)
              except ValueError as exc:
                  raise SystemExit(f"ORL4_EVIDENCE_ERROR: {label} escaped runner temp") from exc

          staging = runner_temp / "pie-orl4-upload"
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          shutil.copyfile(action_file, staging / "action.json")
          shutil.copytree(bridge_root, staging / "bridge")

          safe_repo = os.environ["INPUT_REPOSITORY"].replace("/", "-")
          artifact_name = (
              f"pie-orl4-{safe_repo}-pr-{os.environ['INPUT_PR_NUMBER']}-"
              f"{os.environ['LIVE_HEAD'][:12]}-{event_id[-12:]}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"upload_path={staging}\n")
              handle.write(f"event_id={event_id}\n")
              handle.write(f"action_sha256={action_hash}\n")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "# PIE ORL-4 Explicit Review Action\n\n"
              f"- Target: `{os.environ['INPUT_REPOSITORY']}#{os.environ['INPUT_PR_NUMBER']}`\n"
              f"- Head: `{os.environ['LIVE_HEAD']}`\n"
              f"- Decision: `{review['decision']}`\n"
              f"- Actor: `{review['actor']}`\n"
              f"- Event: `{event_id}`\n"
              f"- Action SHA-256: `{action_hash}`\n"
              "- Human review: `RECORDED`\n"
              "- Outcome: `NOT RECORDED`\n"
              "- Merge / deploy / production-effect authority: `NOT GRANTED`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload ORL-4 governed review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.action.outputs.artifact_name }}
          path: ${{ steps.action.outputs.upload_path }}
          if-no-files-found: error

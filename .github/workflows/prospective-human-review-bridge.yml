name: PIE Human Review Bridge

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact target repository in owner/name form.
        required: true
        type: string
      pull_request_number:
        description: Exact open target pull request number.
        required: true
        type: number
      event_head_sha:
        description: Exact target pull request head SHA.
        required: true
        type: string
      event_base_sha:
        description: Exact target pull request base SHA.
        required: true
        type: string
      trust_request_path:
        description: Authority-repository Trust request path under evidence/trust/requests/.
        required: true
        type: string
      trust_request_sha256:
        description: Exact SHA-256 of the authority Trust request bytes.
        required: true
        type: string
      profile:
        description: Project-local PIE profile path.
        required: false
        default: .review/project.yml
        type: string
      config:
        description: Project-local PIE intelligence config path.
        required: false
        default: .review/intelligence/config.yml
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pie-auto2-${{ inputs.target_repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Governed human-review evidence bridge
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      packet_id: ${{ steps.result.outputs.packet_id }}
      packet_evidence_snapshot_sha256: ${{ steps.result.outputs.packet_evidence_snapshot_sha256 }}
      deterministic_result_sha256: ${{ steps.result.outputs.deterministic_result_sha256 }}
      artifact_name: ${{ steps.result.outputs.artifact_name }}
    steps:
      - name: Validate authority and target inputs
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          AUTHORITY_REVISION: ${{ github.sha }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_HEAD: ${{ inputs.event_head_sha }}
          INPUT_BASE: ${{ inputs.event_base_sha }}
          INPUT_REQUEST_PATH: ${{ inputs.trust_request_path }}
          INPUT_REQUEST_SHA256: ${{ inputs.trust_request_sha256 }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          import re

          sha40 = re.compile(r"^[0-9a-fA-F]{40}$")
          sha256 = re.compile(r"^[0-9a-fA-F]{64}$")
          failures = []

          if os.environ["EVENT_REPOSITORY"].lower() != os.environ["AUTHORITY_REPOSITORY"].lower():
              failures.append("AUTHORITY_BINDING_FAILED: workflow repository is not the PIE authority repository")
          if os.environ["EVENT_REF"] != "refs/heads/main":
              failures.append("AUTHORITY_BINDING_FAILED: AUTO-2 must be dispatched from PIE main")
          if not sha40.fullmatch(os.environ["AUTHORITY_REVISION"]):
              failures.append("AUTHORITY_BINDING_FAILED: workflow revision is not an exact SHA")
          if not os.environ["INPUT_PR_NUMBER"].isdigit() or int(os.environ["INPUT_PR_NUMBER"]) < 1:
              failures.append("INVALID_INPUT: pull_request_number must be positive")
          for field in ("INPUT_HEAD", "INPUT_BASE"):
              if not sha40.fullmatch(os.environ[field]):
                  failures.append(f"INVALID_INPUT: {field.lower()} must be an exact SHA")
          if not sha256.fullmatch(os.environ["INPUT_REQUEST_SHA256"]):
              failures.append("INVALID_INPUT: trust_request_sha256 must be exact")
          repository = os.environ["INPUT_REPOSITORY"].strip()
          if repository.count("/") != 1 or repository.startswith("/") or repository.endswith("/"):
              failures.append("INVALID_INPUT: target_repository must be owner/name")

          request_path = os.environ["INPUT_REQUEST_PATH"].strip().replace("\\", "/")
          parsed_request = PurePosixPath(request_path)
          if (
              parsed_request.is_absolute()
              or ".." in parsed_request.parts
              or not request_path.startswith("evidence/trust/requests/")
              or parsed_request.suffix.lower() != ".json"
          ):
              failures.append("INVALID_INPUT: trust_request_path must be an authority request JSON path")

          for field in ("INPUT_PROFILE", "INPUT_CONFIG"):
              raw = os.environ[field].strip().replace("\\", "/")
              path = PurePosixPath(raw)
              if not raw or path.is_absolute() or ".." in path.parts:
                  failures.append(f"INVALID_INPUT: {field.lower()} must be repository-relative")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Checkout exact target PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: refs/pull/${{ inputs.pull_request_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target checkout
        env:
          EVENT_HEAD_SHA: ${{ inputs.event_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head,,}" != "${EVENT_HEAD_SHA,,}" ]]; then
            echo "STALE_SOURCE_REVISION: event=${EVENT_HEAD_SHA} checked_out=${actual_head}" >&2
            exit 4
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "SOURCE_MISMATCH: checked-out target worktree is not clean" >&2
            exit 4
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact authority revision
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          AUTHORITY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/${AUTHORITY_REPOSITORY}.git@${AUTHORITY_REVISION}"
          pie-trust-prospective run-github-pr-trusted --help >/dev/null

      - name: Prepare governed human-review evidence
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          AUTHORITY_REVISION: ${{ github.sha }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_HEAD: ${{ inputs.event_head_sha }}
          INPUT_BASE: ${{ inputs.event_base_sha }}
          INPUT_REQUEST_PATH: ${{ inputs.trust_request_path }}
          INPUT_REQUEST_SHA256: ${{ inputs.trust_request_sha256 }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/pie-auto2-result.json"
          output_root="${RUNNER_TEMP}/pie-auto2"

          pie-trust-prospective run-github-pr-trusted "${INPUT_PR_NUMBER}" \
            --target-repository "${INPUT_REPOSITORY}" \
            --event-head-sha "${INPUT_HEAD}" \
            --event-base-sha "${INPUT_BASE}" \
            --pie-revision "${AUTHORITY_REVISION}" \
            --trust-request-path "${INPUT_REQUEST_PATH}" \
            --trust-request-sha256 "${INPUT_REQUEST_SHA256}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --profile "${INPUT_PROFILE}" \
            --config "${INPUT_CONFIG}" \
            --output-root "${output_root}" \
            > "${result_file}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          result_path = Path(os.environ["RUNNER_TEMP"]) / "pie-auto2-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("valid") is not True:
              raise SystemExit("AUTO2_INTERNAL_ERROR: bridge did not return valid=true")
          if result.get("status") != "READY_FOR_HUMAN_REVIEW":
              raise SystemExit("AUTO2_BOUNDARY_ERROR: bridge did not stop at READY_FOR_HUMAN_REVIEW")
          for field in (
              "human_review_recorded",
              "outcome_recorded",
              "automation_authorized",
              "pilot_authorized",
              "merge_authorized",
              "deploy_authorized",
              "production_effect_authorized",
          ):
              if result.get(field) is not False:
                  raise SystemExit(f"AUTO2_AUTHORITY_VIOLATION: {field} must remain false")

          digest = result.get("deterministic_result_sha256")
          snapshot = result.get("packet_evidence_snapshot_sha256")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("AUTO2_EVIDENCE_ERROR: deterministic result hash missing")
          if not isinstance(snapshot, str) or re.fullmatch(r"[0-9a-f]{64}", snapshot) is None:
              raise SystemExit("AUTO2_EVIDENCE_ERROR: packet evidence snapshot hash missing")
          if result.get("authority", {}).get("repository") != os.environ["AUTHORITY_REPOSITORY"]:
              raise SystemExit("AUTO2_AUTHORITY_VIOLATION: result authority repository mismatch")
          if result.get("authority", {}).get("revision") != os.environ["AUTHORITY_REVISION"].lower():
              raise SystemExit("AUTO2_AUTHORITY_VIOLATION: result authority revision mismatch")

          bridge_root = Path(result["bridge_root"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          try:
              bridge_root.relative_to(runner_temp)
          except ValueError as exc:
              raise SystemExit("AUTO2_EVIDENCE_ERROR: bridge output escaped runner temp") from exc
          if not (bridge_root / "source" / "trust-request-source.json").is_file():
              raise SystemExit("AUTO2_EVIDENCE_ERROR: trusted source evidence missing")
          if not (bridge_root / "result.json").is_file():
              raise SystemExit("AUTO2_EVIDENCE_ERROR: deterministic bridge result missing")

          staging = runner_temp / "pie-auto2-upload"
          if staging.exists():
              shutil.rmtree(staging)
          shutil.copytree(bridge_root, staging)

          safe_repo = result["target"]["repository"].replace("/", "-")
          artifact_name = (
              f"pie-auto2-{safe_repo}-pr-{result['target']['pull_request']}-"
              f"{result['target']['head_sha'][:12]}-{result['packet_id'][-12:]}"
          )
          outputs = {
              "status": result["status"],
              "packet_id": result["packet_id"],
              "packet_evidence_snapshot_sha256": snapshot,
              "deterministic_result_sha256": digest,
              "artifact_name": artifact_name,
              "upload_path": str(staging),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "# PIE AUTO-2 Human Review Bridge\n\n"
              f"- Status: `{result['status']}`\n"
              f"- Target: `{result['target']['repository']}#{result['target']['pull_request']}`\n"
              f"- Target head: `{result['target']['head_sha']}`\n"
              f"- Authority revision: `{result['authority']['revision']}`\n"
              f"- Trust request SHA-256: `{result['trust_request']['content_sha256']}`\n"
              f"- Assessment: `{result['assessment_id']}`\n"
              f"- Packet: `{result['packet_id']}`\n"
              f"- Packet evidence snapshot: `{snapshot}`\n"
              f"- Deterministic bridge hash: `{digest}`\n"
              "- Human review: `NOT RECORDED`\n"
              "- Outcome: `NOT RECORDED`\n"
              "- Merge / deploy / production-effect authority: `NOT GRANTED`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload AUTO-2 evidence capsule
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.result.outputs.artifact_name }}
          path: ${{ steps.result.outputs.upload_path }}

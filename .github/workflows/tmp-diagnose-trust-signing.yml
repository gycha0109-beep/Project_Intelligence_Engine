name: Temporary Trust Signing Diagnostic

on:
  push:
    branches:
      - feat/trust-signing-trust-root-authority

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[trust-signing-diagnosed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Capture unittest failures
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/trust-signing-unittest.log 2>&1
          status=$?
          tail -n 500 /tmp/trust-signing-unittest.log > TRUST_SIGNING_DIAGNOSTIC.txt
          echo "UNITTEST_EXIT_STATUS=$status" >> TRUST_SIGNING_DIAGNOSTIC.txt
          exit 0
      - name: Persist diagnostic and remove helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-diagnose-trust-signing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRUST_SIGNING_DIAGNOSTIC.txt
          git commit -m "chore(trust): capture v1.5 unittest failure [trust-signing-diagnosed]"
          git push origin HEAD:feat/trust-signing-trust-root-authority

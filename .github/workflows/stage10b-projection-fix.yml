name: Stage 10B Projection Fix

on:
  push:
    branches: [agent/stage-10b-decision-outcome-audit]
    paths:
      - scripts/fix_stage10b_projection.py
      - .github/workflows/stage10b-projection-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-10b-decision-outcome-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_stage10b_projection.py
      - run: python scripts/sync_package_assets.py
      - run: pip install -e .
      - run: python -m unittest tests.test_trust_comparison -v
      - run: python -m unittest discover -s tests -v
      - run: pie-trust --help
      - run: pie-trust-comparison --help
      - run: pip wheel . --no-deps --wheel-dir dist-stage10b
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/trust_comparison.py src/review_system/assets/schemas/trust-comparison-registry.schema.json
          git diff --cached --quiet || git commit -m "fix Stage 10B Trust report projection"
          git push origin HEAD:agent/stage-10b-decision-outcome-audit

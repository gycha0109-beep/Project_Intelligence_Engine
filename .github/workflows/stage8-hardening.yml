name: Stage 8 Hardening

on:
  push:
    branches:
      - agent/stage-8-reground-foundation
    paths:
      - scripts/harden_stage8_reground.py
      - .github/workflows/stage8-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage8-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-8-reground-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/harden_stage8_reground.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_reground*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie-reground --help
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/reground.py src/review_system/reground_cli.py tests/test_reground.py tests/test_reground_hardening.py
          git diff --cached --quiet || git commit -m "harden Reground identity and canonical verification"
          git push origin HEAD:agent/stage-8-reground-foundation

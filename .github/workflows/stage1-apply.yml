name: Stage 1 Apply

on:
  push:
    branches:
      - agent/stage-1-application-boundary
    paths:
      - scripts/apply_stage1_refactor.py
      - .github/workflows/stage1-apply.yml
  pull_request:
    branches:
      - agent/stage-0-architecture-baseline
    paths:
      - scripts/apply_stage1_refactor.py
      - .github/workflows/stage1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-1-application-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage1_refactor.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee stage1-unittest-output.txt
      - name: Upload Stage 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-unittest-diagnostics
          path: stage1-unittest-output.txt
      - name: Enforce unit-test result
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
      - name: Commit verified CLI refactor
        shell: bash
        run: |
          rm stage1-unittest-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/cli.py
          git commit -m "extract analyze-pr application boundary"
          git push origin HEAD:agent/stage-1-application-boundary

name: Validation - BuildMap PR65 task-class sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validation-buildmap-pr65-taskclass-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: gycha0109-beep/BuildMap
      TARGET_PR: '65'
      TARGET_HEAD: 3d36bd7f64fd770c52f749836043b29390b05f77
    steps:
      - name: Checkout PIE validation harness
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PIE
        run: python -m pip install -e .

      - name: Verify fixed historical PR fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p calibration/input
          gh api "repos/${TARGET_REPO}/pulls/${TARGET_PR}" > calibration/input/pr65.json
          gh api --paginate "repos/${TARGET_REPO}/pulls/${TARGET_PR}/files?per_page=100" > calibration/input/pr65-files.json
          python - <<'PY'
          import json, os
          pr=json.load(open('calibration/input/pr65.json',encoding='utf-8'))
          files=json.load(open('calibration/input/pr65-files.json',encoding='utf-8'))
          expected=[
            'apps/web/app/projects/[projectId]/github-integration-actions.ts',
            'apps/web/lib/notion/api.ts',
            'apps/web/lib/notion/resource.ts',
            'docs/access-policy-tests/phase51-p3-integration-activation-readiness-controlled-live-e2e.md',
            'docs/decisions/phase51-p3-integration-activation-readiness-controlled-live-e2e.md',
          ]
          actual=sorted(x['filename'] for x in files)
          assert pr['head']['sha']==os.environ['TARGET_HEAD'], (pr['head']['sha'], os.environ['TARGET_HEAD'])
          assert pr['state']=='closed'
          assert pr['merged_at'] is not None
          assert pr['changed_files']==5
          assert actual==sorted(expected), actual
          open('calibration/input/changed-files.json','w',encoding='utf-8').write(json.dumps(expected,indent=2)+'\n')
          PY

      - name: Create task-class variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('calibration')
          files=json.load(open(root/'input/changed-files.json',encoding='utf-8'))
          readiness={
            'policy_id':'buildmap-taskclass-sensitivity-v1',
            'policy_version':'1.0.0',
            'min_ledger_runs':1,
            'min_ledger_decisions':1,
            'min_defects':1,
            'min_closed_defects':0,
            'min_reground_observations':1,
            'min_reground_coverage':1.0,
            'min_reground_precision':1.0,
            'min_reground_recall':1.0,
            'max_reground_false_positive_rate':0.0,
            'require_active_policy':True,
            'require_pass_evaluation':True,
            'require_holdout':True,
            'require_repeatability':True,
            'require_zero_protected_negative_regressions':True,
          }
          for task_class in ['routine_code','authentication','authorization','security']:
            d=root/task_class
            d.mkdir(parents=True,exist_ok=True)
            request={
              'schema_version':'1.0',
              'task_id':f'buildmap-pr65-taskclass-{task_class}',
              'source_revision':'git:'+os.environ['TARGET_HEAD'],
              'task_class':task_class,
              'changed_files':files,
              'required_scenarios':['exact_head_ci'],
              'completed_scenarios':['exact_head_ci'],
              'repository_match':True,
              'head_match':True,
              'rollback_evidence':False,
              'replay_evidence':False,
              'readiness_policy':readiness,
            }
            (d/'trust-request.json').write_text(json.dumps(request,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run Trust classification for all variants
        shell: bash
        run: |
          set -euo pipefail
          for task_class in routine_code authentication authorization security; do
            pie-trust assess \
              --request "calibration/${task_class}/trust-request.json" \
              --profile profiles/examples/buildmap.yml \
              --output "calibration/${task_class}/trust-report.json" \
              > "calibration/${task_class}/assess.stdout.json"
            pie-trust verify-report \
              --report "calibration/${task_class}/trust-report.json" \
              --request "calibration/${task_class}/trust-request.json" \
              --profile profiles/examples/buildmap.yml \
              > "calibration/${task_class}/verify.stdout.json"
          done

      - name: Summarize sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('calibration')
          rows=[]
          for task_class in ['routine_code','authentication','authorization','security']:
            report=json.load(open(root/task_class/'trust-report.json',encoding='utf-8'))
            rows.append({
              'task_class':task_class,
              'base_band':report['risk']['base_band'],
              'path_floor_band':report['risk']['path_floor_band'],
              'effective_band':report['risk']['effective_band'],
              'review_requirement':report['task_advisory']['review_requirement'],
              'triggered_hard_gates':report['task_advisory']['triggered_hard_gates'],
              'risk_reasons':report['risk']['reasons'],
              'readiness':report['readiness']['status'],
              'automation_authorized':report['automation_authorized'],
            })
          result={
            'experiment':'BuildMap PR65 task-class sensitivity',
            'pie_main':'ea287d4d4c83d27b112c6161d4daa67840916437',
            'buildmap_pr':65,
            'buildmap_head':'3d36bd7f64fd770c52f749836043b29390b05f77',
            'changed_files_fixed':True,
            'required_scenarios_fixed':['exact_head_ci'],
            'completed_scenarios_fixed':['exact_head_ci'],
            'profile':'profiles/examples/buildmap.yml',
            'variants':rows,
          }
          (root/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: buildmap-pr65-taskclass-sensitivity
          path: calibration
          if-no-files-found: error

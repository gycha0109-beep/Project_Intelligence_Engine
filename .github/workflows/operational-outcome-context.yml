name: PIE Outcome Declaration Context

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact target repository in owner/name form.
        required: true
        type: string
      pull_request_number:
        description: Target pull request number with an existing ORL-4 review action.
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pie-orl5-${{ inputs.target_repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  context:
    name: Prepare Outcome declaration context
    runs-on: ubuntu-latest
    steps:
      - name: Validate authority and inputs
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          AUTHORITY_REVISION: ${{ github.sha }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          sha40 = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []
          if os.environ["EVENT_REPOSITORY"].lower() != os.environ["AUTHORITY_REPOSITORY"].lower():
              failures.append("AUTHORITY_BINDING_FAILED: workflow repository is not PIE authority")
          if os.environ["EVENT_REF"] != "refs/heads/main":
              failures.append("AUTHORITY_BINDING_FAILED: ORL-5 must be dispatched from PIE main")
          if not sha40.fullmatch(os.environ["AUTHORITY_REVISION"]):
              failures.append("AUTHORITY_BINDING_FAILED: authority revision is not an exact SHA")
          repository = os.environ["INPUT_REPOSITORY"].strip()
          if repository.count("/") != 1 or repository.startswith("/") or repository.endswith("/"):
              failures.append("INVALID_INPUT: target_repository must be owner/name")
          if not os.environ["INPUT_PR_NUMBER"].isdigit() or int(os.environ["INPUT_PR_NUMBER"]) < 1:
              failures.append("INVALID_INPUT: pull_request_number must be positive")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Checkout exact authority revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact authority revision
        env:
          AUTHORITY_REPOSITORY: gycha0109-beep/Project_Intelligence_Engine
          AUTHORITY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/${AUTHORITY_REPOSITORY}.git@${AUTHORITY_REVISION}"
          pie-trust-prospective prepare-operational-outcome-context --help >/dev/null

      - name: Prepare source-bound context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/pie-orl5-result.json"
          context_file="${RUNNER_TEMP}/outcome-context.json"
          cache_root="${RUNNER_TEMP}/orl5-cache"

          pie-trust-prospective prepare-operational-outcome-context \
            --target-repository "${INPUT_REPOSITORY}" \
            --pull-request "${INPUT_PR_NUMBER}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --artifact-cache-root "${cache_root}" \
            --output "${context_file}" \
            > "${result_file}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pie-orl5-result.json").read_text(encoding="utf-8"))
          if result.get("valid") is not True:
              raise SystemExit("ORL5_INTERNAL_ERROR: context command did not return valid=true")
          if result.get("status") != "OUTCOME_DECLARATION_CONTEXT_PREPARED":
              raise SystemExit("ORL5_BOUNDARY_ERROR: invalid terminal status")
          authority = result.get("authority", {})
          if authority.get("human_review_recorded") is not True:
              raise SystemExit("ORL5_SOURCE_ERROR: prior human review must be recorded")
          for field in (
              "human_outcome_declared",
              "automatic_outcome_inference",
              "outcome_recorded",
              "automation_authorized",
              "pilot_authorized",
              "merge_authorized",
              "deploy_authorized",
              "production_effect_authorized",
              "merge_observation_is_outcome_authority",
              "ci_observation_is_outcome_authority",
          ):
              if authority.get(field) is not False:
                  raise SystemExit(f"ORL5_AUTHORITY_VIOLATION: {field} must remain false")
          auto3 = result.get("auto3_declaration_context", {})
          if auto3.get("selected_authority_type") is not None or auto3.get("selected_verdict") is not None:
              raise SystemExit("ORL5_AUTHORITY_VIOLATION: ORL-5 selected Outcome semantics")
          if auto3.get("declaration_materialized") is not False:
              raise SystemExit("ORL5_AUTHORITY_VIOLATION: ORL-5 materialized AUTO-3A declaration")
          digest = result.get("context_sha256")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("ORL5_EVIDENCE_ERROR: context hash missing")

          context_file = Path(result["context_file"]).resolve()
          selected = Path(result["selected_action_root"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          for path in (context_file, selected):
              try:
                  path.relative_to(runner_temp)
              except ValueError as exc:
                  raise SystemExit("ORL5_EVIDENCE_ERROR: output escaped runner temp") from exc

          staging = runner_temp / "pie-orl5-upload"
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          shutil.copyfile(context_file, staging / "context.json")
          shutil.copytree(selected, staging / "review-action-source")

          repo = result["source"]["repository"]["name_with_owner"]
          pr = result["source"]["pull_request"]
          safe_repo = repo.replace("/", "-")
          artifact_name = f"pie-orl5-{safe_repo}-pr-{pr['number']}-{pr['head_oid'][:12]}-{digest[:12]}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"upload_path={staging}\n")
              handle.write(f"context_sha256={digest}\n")

          observation = result["observations"]["pull_request"]
          checks = result["observations"]["checks"]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "# PIE ORL-5 Outcome Declaration Context\n\n"
              f"- Target: `{repo}#{pr['number']}`\n"
              f"- Source head: `{pr['head_oid']}`\n"
              f"- Human review: `RECORDED`\n"
              f"- Observed PR state: `{observation['state']}`\n"
              f"- Observed merged: `{observation['merged']}`\n"
              f"- Observed checks: `{len(checks)}`\n"
              f"- Context SHA-256: `{digest}`\n"
              "- Human Outcome declaration: `NOT RECORDED`\n"
              "- AUTO-3 authority/verdict selection: `NOT PERFORMED`\n"
              "- Merge / CI observations are Outcome authority: `NO`\n"
              "- Merge / deploy / production-effect authority: `NOT GRANTED`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload ORL-5 context evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: ${{ steps.context.outputs.upload_path }}
          if-no-files-found: error

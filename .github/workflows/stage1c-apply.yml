name: Stage 1C Apply

on:
  push:
    branches:
      - agent/stage-1c-rule-gate-boundary
    paths:
      - scripts/apply_stage1c_refactor.py
      - .github/workflows/stage1c-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-1c-rule-gate-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage1c_refactor.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - name: Run tests and capture result
        run: |
          set +e
          python -m unittest discover -s tests -v > stage1c-unittest-output.txt 2>&1
          status=$?
          echo "$status" > stage1c-unittest-status.txt
          cat stage1c-unittest-output.txt
          exit 0
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=$(cat stage1c-unittest-status.txt)
          if [ "$status" = "0" ]; then
            git add src/review_system/cli.py src/review_system/intelligence_learning.py
            git commit -m "extract rule approval and gate application boundaries"
          else
            git add stage1c-unittest-output.txt stage1c-unittest-status.txt
            git commit -m "capture Stage 1C test failure"
          fi
          git push origin HEAD:agent/stage-1c-rule-gate-boundary
          exit "$status"

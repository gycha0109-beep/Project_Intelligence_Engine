name: Stage 7 Hardening

on:
  push:
    branches:
      - agent/stage-7-policy-registry
    paths:
      - scripts/harden_stage7_policy.py
      - .github/workflows/stage7-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage7-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-7-policy-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/harden_stage7_policy.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_policy_registry*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie-policy --help
      - run: pie-eval --help
      - run: pie --help
      - name: Commit verified Stage 7 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/policy_registry.py tests/test_policy_registry_hardening.py
          git diff --cached --quiet || git commit -m "harden Policy Registry identity and lineage verification"
          git push origin HEAD:agent/stage-7-policy-registry

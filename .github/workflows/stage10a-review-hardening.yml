name: Stage 10A Review Hardening

on:
  push:
    branches:
      - agent/stage-10a-trust-gate-readiness
    paths:
      - scripts/apply_stage10a_review_hardening.py
      - .github/workflows/stage10a-review-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage10a-review-hardening
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-10a-trust-gate-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture verification diagnostics
        run: |
          set +e
          : > stage10a-review-hardening.log
          python scripts/apply_stage10a_review_hardening.py >> stage10a-review-hardening.log 2>&1
          echo "APPLY_EXIT=$?" >> stage10a-review-hardening.log
          python scripts/sync_package_assets.py >> stage10a-review-hardening.log 2>&1
          echo "SYNC_EXIT=$?" >> stage10a-review-hardening.log
          pip install -e . >> stage10a-review-hardening.log 2>&1
          echo "INSTALL_EXIT=$?" >> stage10a-review-hardening.log
          python -m compileall -q src tests >> stage10a-review-hardening.log 2>&1
          echo "COMPILE_EXIT=$?" >> stage10a-review-hardening.log
          python -m unittest discover -s tests -p 'test_trust_gate*.py' -v >> stage10a-review-hardening.log 2>&1
          echo "FOCUSED_EXIT=$?" >> stage10a-review-hardening.log
          python -m unittest discover -s tests -v >> stage10a-review-hardening.log 2>&1
          echo "FULL_EXIT=$?" >> stage10a-review-hardening.log
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage10a-review-hardening.log
          git commit -m "capture Stage 10A hardening diagnostics"
          git push origin HEAD:agent/stage-10a-trust-gate-readiness

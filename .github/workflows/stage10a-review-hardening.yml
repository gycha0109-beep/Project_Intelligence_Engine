name: Stage 10A Review Hardening

on:
  push:
    branches:
      - agent/stage-10a-trust-gate-readiness
    paths:
      - scripts/apply_stage10a_review_hardening.py
      - .github/workflows/stage10a-review-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage10a-review-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-10a-trust-gate-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage10a_review_hardening.py
      - run: python scripts/sync_package_assets.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_trust_gate*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie trust-assess --help
      - run: pie validate-trust-report --help
      - run: pie-trust --help
      - run: pip wheel . --no-deps --wheel-dir dist-stage10a-review
      - name: Commit verified review hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/trust.py src/review_system/trust_cli.py tests/test_trust_gate.py tests/test_trust_gate_hardening.py
          git diff --cached --quiet || git commit -m "harden Trust readiness evidence metrics"
          git push origin HEAD:agent/stage-10a-trust-gate-readiness

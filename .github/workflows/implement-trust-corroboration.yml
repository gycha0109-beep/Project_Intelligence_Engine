name: Implement trust task-class corroboration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-trust-corroboration.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded corroboration patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/_bootstrap_task_class_corroboration.py
      - name: Commit implementation without bootstrap workflow
        run: echo "commit is owned by the existing CI bootstrap job"

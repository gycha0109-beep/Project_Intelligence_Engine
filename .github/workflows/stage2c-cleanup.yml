name: Stage 2C Cleanup

on:
  push:
    branches:
      - agent/stage-2c-repository-binding

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2c-repository-binding
      - name: Remove temporary Stage 2C assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/stage2c-apply.yml \
            .github/workflows/stage2c-apply-v2.yml \
            .github/workflows/stage2c-cleanup.yml \
            scripts/apply_stage2c_refactor.py \
            docs/architecture/.stage2c-trigger \
            docs/architecture/.stage2c-cleanup-trigger
          git commit -m "remove temporary Stage 2C assets"
          git push origin HEAD:agent/stage-2c-repository-binding

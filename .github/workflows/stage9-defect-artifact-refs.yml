name: Stage 9 Defect Artifact References

on:
  push:
    branches:
      - agent/stage-9-buildmap-export
    paths:
      - scripts/apply_stage9_defect_artifact_refs.py
      - .github/workflows/stage9-defect-artifact-refs.yml

permissions:
  contents: write

concurrency:
  group: stage9-defect-artifact-refs
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-9-buildmap-export
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and diagnose
        run: |
          set +e
          python scripts/apply_stage9_defect_artifact_refs.py > stage9-defect-artifact.log 2>&1
          apply=$?
          echo "APPLY_EXIT=$apply" >> stage9-defect-artifact.log
          python scripts/sync_package_assets.py >> stage9-defect-artifact.log 2>&1
          sync=$?
          echo "SYNC_EXIT=$sync" >> stage9-defect-artifact.log
          pip install -e . >> stage9-defect-artifact.log 2>&1
          install=$?
          echo "INSTALL_EXIT=$install" >> stage9-defect-artifact.log
          python -m compileall -q src tests >> stage9-defect-artifact.log 2>&1
          compile=$?
          echo "COMPILE_EXIT=$compile" >> stage9-defect-artifact.log
          python -m unittest discover -s tests -p 'test_buildmap_export*.py' -v >> stage9-defect-artifact.log 2>&1
          focused=$?
          echo "FOCUSED_EXIT=$focused" >> stage9-defect-artifact.log
          python -m unittest discover -s tests -v >> stage9-defect-artifact.log 2>&1
          full=$?
          echo "FULL_EXIT=$full" >> stage9-defect-artifact.log
          echo "RESULT=$apply,$sync,$install,$compile,$focused,$full" >> stage9-defect-artifact.log
          exit 0
      - name: Commit diagnosis and applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage9-defect-artifact.log schemas/buildmap-export.schema.json src/review_system/assets/schemas/buildmap-export.schema.json src/review_system/buildmap_export.py tests/test_buildmap_export.py tests/test_buildmap_export_hardening.py
          git diff --cached --quiet || git commit -m "capture Stage 9 Defect Artifact reference diagnosis"
          git push origin HEAD:agent/stage-9-buildmap-export

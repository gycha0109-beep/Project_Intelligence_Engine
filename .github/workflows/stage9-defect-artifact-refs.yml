name: Stage 9 Defect Artifact References

on:
  push:
    branches:
      - agent/stage-9-buildmap-export
    paths:
      - scripts/fix_stage9_defect_ref_assertion.py
      - .github/workflows/stage9-defect-artifact-refs.yml

permissions:
  contents: write

concurrency:
  group: stage9-defect-artifact-refs
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-9-buildmap-export
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fix_stage9_defect_ref_assertion.py
      - run: python scripts/sync_package_assets.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_buildmap_export*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie export-buildmap --help
      - run: pie validate-buildmap-export --help
      - run: pip wheel . --no-deps --wheel-dir dist-stage9
      - name: Commit verified assertion repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_buildmap_export.py
          git diff --cached --quiet || git commit -m "verify Defect Artifact redaction by relation"
          git push origin HEAD:agent/stage-9-buildmap-export

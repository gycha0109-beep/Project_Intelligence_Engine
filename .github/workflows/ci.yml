name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Capture full-suite failure ids
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=0).run(suite)
          ids = [test.id() for test, _ in result.failures + result.errors]
          Path('failure-ids.txt').write_text('\n'.join(ids) + '\n', encoding='utf-8')
          PY
      - name: Failure is Stage 10C core
        continue-on-error: true
        run: if grep -q 'test_trust_reconciliation\.' failure-ids.txt; then exit 1; fi
      - name: Failure is Stage 10C hardening
        continue-on-error: true
        run: if grep -q 'test_trust_reconciliation_hardening' failure-ids.txt; then exit 1; fi
      - name: Failure is Trust existing
        continue-on-error: true
        run: if grep -E -q 'test_trust_(gate|comparison|observation)' failure-ids.txt; then exit 1; fi
      - name: Failure is validation
        continue-on-error: true
        run: if grep -q 'test_validation' failure-ids.txt; then exit 1; fi
      - name: Failure is other existing domain
        continue-on-error: true
        run: |
          if test -s failure-ids.txt && ! grep -E -q 'test_trust_reconciliation|test_trust_(gate|comparison|observation)|test_validation' failure-ids.txt; then exit 1; fi
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

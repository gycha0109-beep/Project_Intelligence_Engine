name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Run unittest suite with temporary diagnostic log
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload temporary unittest diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-python-${{ matrix.python-version }}
          path: unittest.log
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

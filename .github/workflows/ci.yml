name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-output.txt
      - name: Upload Python 3.11 unit-test diagnostics
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: unittest-output-python-3.11
          path: unittest-output.txt
      - name: Enforce unit-test result
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

  stage10j-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [call, result, file, mock]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: materialize postcondition isolation
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          PYTHONPATH=.:tests python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          from review_system.github_prospective_capture import (
              build_github_prospective_capture_candidate,
              materialize_github_prospective_capture,
              write_github_prospective_capture_candidate,
          )
          from test_github_prospective_capture import HEAD, _MaterializeCLI, _profile, _source, _request
          case = os.environ['DIAGNOSTIC_CASE']
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              profile = _profile(root)
              candidate = build_github_prospective_capture_candidate(_source(), profile)
              candidate_path = write_github_prospective_capture_candidate(root / 'candidate.json', candidate)
              request_path = root / 'request.json'
              request_path.write_text(json.dumps(_request(candidate)), encoding='utf-8')
              report_path = root / '.pie' / 'prospective-trust-report.json'
              with patch(
                  'review_system.github_prospective_capture.intake_prospective_case',
                  return_value={
                      'assessment_id': 'assessment-test',
                      'predicted_risk_band': 'R2',
                      'source_revision': HEAD,
                      'idempotent': False,
                      'registry_sha256': 'd' * 64,
                  },
              ) as intake:
                  result = materialize_github_prospective_capture(
                      candidate_path,
                      request=request_path,
                      workspace=root / 'workspace',
                      profile=profile,
                      repository_root=root,
                      github_cli=_MaterializeCLI(),
                      collect_pr=lambda *args, **kwargs: (_source(), None),
                      capture_state=lambda *args, **kwargs: {'repository': {'head_revision': HEAD, 'working_tree_dirty': False}},
                      trust_report_output=report_path,
                      generated_at='2026-08-19T00:10:00Z',
                      captured_at='2026-08-19T00:11:00Z',
                  )
                  if case == 'result':
                      assert result['assessment_id'] == 'assessment-test'
                      assert result['source_revision'] == HEAD
                      assert result['automation_authorized'] is False
                      assert result['pilot_authorized'] is False
                      assert result['human_review_recorded'] is False
                      assert result['outcome_recorded'] is False
                  elif case == 'file':
                      assert report_path.is_file()
                  elif case == 'mock':
                      intake.assert_called_once()
          PY

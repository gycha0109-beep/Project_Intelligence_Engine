name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

  stage10j-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - test_github_prospective_capture.py
          - test_github_prospective_capture_cli.py
          - test_application_analyze_pr.py
          - test_trust_prospective_evidence.py
          - test_trust_prospective_evidence_cli.py
          - test_trust_prospective_evidence_hardening.py
          - test_trust_prospective_evidence_outcomes.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -p "${{ matrix.pattern }}" -v

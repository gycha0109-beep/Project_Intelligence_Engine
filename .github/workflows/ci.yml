name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

  stage10j-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: capture failing materialize traceback
        run: |
          set +e
          PYTHONPATH=.:tests python -m unittest -v \
            test_github_prospective_capture.GitHubProspectiveCaptureTests.test_materialization_creates_stage10a_report_then_calls_stage10i_intake \
            > stage10j-materialize.log 2>&1
          code=$?
          echo "$code" > stage10j-exitcode.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage10j-materialize-traceback
          path: |
            stage10j-materialize.log
            stage10j-exitcode.txt
      - name: preserve diagnostic failure
        run: test "$(cat stage10j-exitcode.txt)" = "0"

name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Full unittest
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" != "3.14" ]; then
            python -m unittest discover -s tests -v
            exit $?
          fi
          set +e
          python -m unittest discover -s tests -v > /tmp/trust-signing-unittest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 500 /tmp/trust-signing-unittest.log > TRUST_SIGNING_DIAGNOSTIC.txt
            echo "UNITTEST_EXIT_STATUS=$status" >> TRUST_SIGNING_DIAGNOSTIC.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TRUST_SIGNING_DIAGNOSTIC.txt
            git commit -m "chore(trust): persist unittest failure [trust-signing-ci-diagnostic]"
            git push origin HEAD:feat/trust-signing-trust-root-authority
          fi
          cat /tmp/trust-signing-unittest.log
          exit "$status"
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Diagnose application-buildmap group
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_application*.py' -v
          python -m unittest discover -s tests -p 'test_asset*.py' -v
          python -m unittest discover -s tests -p 'test_baseline*.py' -v
          python -m unittest discover -s tests -p 'test_buildmap*.py' -v
      - name: Diagnose cli-defect-evaluation-github group
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_cli*.py' -v
          python -m unittest discover -s tests -p 'test_defect*.py' -v
          python -m unittest discover -s tests -p 'test_evaluation*.py' -v
          python -m unittest discover -s tests -p 'test_gate*.py' -v
          python -m unittest discover -s tests -p 'test_github*.py' -v
      - name: Diagnose intelligence-ledger-policy group
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_identity*.py' -v
          python -m unittest discover -s tests -p 'test_intelligence*.py' -v
          python -m unittest discover -s tests -p 'test_ledger*.py' -v
          python -m unittest discover -s tests -p 'test_merge*.py' -v
          python -m unittest discover -s tests -p 'test_packs*.py' -v
          python -m unittest discover -s tests -p 'test_path*.py' -v
          python -m unittest discover -s tests -p 'test_policy*.py' -v
          python -m unittest discover -s tests -p 'test_profile*.py' -v
      - name: Diagnose project-reground-run group
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_project*.py' -v
          python -m unittest discover -s tests -p 'test_reground*.py' -v
          python -m unittest discover -s tests -p 'test_review*.py' -v
          python -m unittest discover -s tests -p 'test_run*.py' -v
          python -m unittest discover -s tests -p 'test_validation*.py' -v
      - name: Diagnose combined Trust cluster
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_trust*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

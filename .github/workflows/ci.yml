name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Capture full-suite result identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=0).run(suite)
          rows = [f"FAIL:{test.id()}" for test, _ in result.failures]
          rows += [f"ERROR:{test.id()}" for test, _ in result.errors]
          rows += [f"UNEXPECTED:{test.id()}" for test in result.unexpectedSuccesses]
          Path('suite-result-ids.txt').write_text('\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8')
          PY
      - name: Stop if application-asset-buildmap failed
        run: if grep -E -q 'test_(application|asset|baseline|buildmap)' suite-result-ids.txt; then exit 1; fi
      - name: Stop if cli-defect-evaluation-github failed
        run: if grep -E -q 'test_(cli|defect|evaluation|gate|github)' suite-result-ids.txt; then exit 1; fi
      - name: Stop if identity-ledger-policy-profile failed
        run: if grep -E -q 'test_(identity|intelligence|ledger|merge|packs|path|policy|profile)' suite-result-ids.txt; then exit 1; fi
      - name: Stop if project-reground-review-run-validation failed
        run: if grep -E -q 'test_(project|reground|review|run|validation)' suite-result-ids.txt; then exit 1; fi
      - name: Stop if Trust failed
        run: if grep -q 'test_trust' suite-result-ids.txt; then exit 1; fi
      - name: Stop if uncategorized result remains
        run: test ! -s suite-result-ids.txt
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

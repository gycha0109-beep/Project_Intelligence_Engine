name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  implement-trust-corroboration:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/trust-task-class-corroboration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute bounded bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/implement-trust-corroboration.yml').read_text(encoding='utf-8')
          start = source.index('      - name: Apply bounded corroboration patch\n')
          end = source.index('      - name: Commit implementation without bootstrap workflow\n', start)
          segment = source[start:end]
          marker = '        run: |\n'
          script = segment[segment.index(marker) + len(marker):]
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace("schema['properties']['profile']['properties']", "schema['$defs']['profile']['properties']")
          script = script.replace("schema['properties']['risk']['properties']", "schema['$defs']['risk']['properties']")
          Path('/tmp/apply-trust-corroboration.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-trust-corroboration.sh
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/implement-trust-corroboration.yml .github/trigger-trust-corroboration.txt
          git add -- src/review_system/trust.py schemas/trust-report.schema.json src/review_system/assets/schemas/trust-report.schema.json tests/test_buildmap_task_class_corroboration.py
          git diff --cached --check
          git commit -m "fix(trust): corroborate declared task class"
          git push origin HEAD:${{ github.head_ref }}
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: Capture full-suite result identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=0).run(suite)
          rows = [f"FAIL:{test.id()}" for test, _ in result.failures]
          rows += [f"ERROR:{test.id()}" for test, _ in result.errors]
          rows += [f"UNEXPECTED:{test.id()}" for test in result.unexpectedSuccesses]
          Path('suite-result-ids.txt').write_text('\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8')
          PY
      - name: Stop if future-transition review failed
        run: if grep -q 'test_future_defect_transition_cannot_backfill_old_unsafe_outcome' suite-result-ids.txt; then exit 1; fi
      - name: Stop if future-finding review failed
        run: if grep -q 'test_future_finding_link_cannot_backfill_old_revision_relation' suite-result-ids.txt; then exit 1; fi
      - name: Stop if evaluation-ambiguity review failed
        run: if grep -q 'test_same_revision_nonholdout_duplicates_do_not_make_holdout_ambiguous' suite-result-ids.txt; then exit 1; fi
      - name: Stop if base-status-tamper review failed
        run: if grep -q 'test_outcome_base_status_semantic_tamper_is_rejected_after_rehash' suite-result-ids.txt; then exit 1; fi
      - name: Stop if orphan-manifest review failed
        run: if grep -q 'test_orphan_manifest_assessment_and_outcome_are_rejected' suite-result-ids.txt; then exit 1; fi
      - name: Stop if lexical-symlink review failed
        run: if grep -q 'test_lexical_symlink_reference_is_rejected' suite-result-ids.txt; then exit 1; fi
      - name: Stop if any other result remains
        run: test ! -s suite-result-ids.txt
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-profile profiles/examples/generic-webapp.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

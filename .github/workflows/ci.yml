name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - run: python -m unittest discover -s tests -v
      - run: urs version
      - run: urs validate-profile profiles/examples/journey-connect.yml
      - run: urs validate-profile profiles/examples/bejewely.yml
      - run: urs validate-profile profiles/examples/buildmap.yml
      - run: urs validate-findings examples/findings.sample.json
      - run: pip wheel . --no-deps --wheel-dir dist-ci

  stage10j-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [trust, materialize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/sync_package_assets.py
      - name: direct Stage 10A report
        if: matrix.case == 'trust'
        run: |
          PYTHONPATH=.:tests python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from review_system.github_prospective_capture import build_github_prospective_capture_candidate
          from review_system.trust import assess_trust, write_trust_report
          from test_github_prospective_capture import _profile, _source, _request
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              profile = _profile(root)
              candidate = build_github_prospective_capture_candidate(_source(), profile)
              request_path = root / 'request.json'
              request_path.write_text(json.dumps(_request(candidate)), encoding='utf-8')
              report = assess_trust(request_path, profile, generated_at='2026-08-19T00:10:00Z')
              target = root / '.pie' / 'prospective-trust-report.json'
              write_trust_report(target, report)
              assert target.is_file()
          PY
      - name: full materialize handoff
        if: matrix.case == 'materialize'
        run: >-
          PYTHONPATH=.:tests python -m unittest -v
          test_github_prospective_capture.GitHubProspectiveCaptureTests.test_materialization_creates_stage10a_report_then_calls_stage10i_intake

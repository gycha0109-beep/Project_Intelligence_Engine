name: Calibration Historical Backfill

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      source_pie_revision:
        required: true
        type: string
      backfill_revision:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate caller-local backfill binding
        env:
          REPOSITORY: ${{ inputs.repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_PIE_REVISION: ${{ inputs.source_pie_revision }}
          BACKFILL_REVISION: ${{ inputs.backfill_revision }}
        shell: bash
        run: |
          [[ "$REPOSITORY" == "$CALLER_REPOSITORY" ]] || {
            echo "Historical backfill must read artifacts from the caller repository only."
            exit 1
          }
          [[ "$SOURCE_PIE_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_pie_revision must be an exact Git SHA."
            exit 1
          }
          [[ "$BACKFILL_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "backfill_revision must be an exact Git SHA."
            exit 1
          }
      - name: Install exact backfill implementation
        env:
          BACKFILL_REVISION: ${{ inputs.backfill_revision }}
        run: pip install "git+https://github.com/gycha0109-beep/Project_Intelligence_Engine.git@${BACKFILL_REVISION}"
      - name: Backfill caller-local legacy observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          SOURCE_PIE_REVISION: ${{ inputs.source_pie_revision }}
        run: |
          pie-calibration-backfill \
            --repository "$REPOSITORY" \
            --pie-revision "$SOURCE_PIE_REVISION" \
            --output calibration-backfill
      - uses: actions/upload-artifact@v4
        with:
          name: pie-calibration-historical-backfill-${{ github.event.repository.name }}-${{ inputs.source_pie_revision }}
          path: calibration-backfill/
          if-no-files-found: error
          retention-days: 90

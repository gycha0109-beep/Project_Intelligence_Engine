name: Validation - BuildMap PR67 corroboration feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validation-buildmap-pr67-corroboration-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  corroborate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: gycha0109-beep/BuildMap
      TARGET_PR: '67'
      TARGET_BASE: d977d024f1dc6aadb016cf449492637464cf633b
      TARGET_HEAD: e7920f9436b293e8e40ca0be1d2eeb2697a58ea1
      WEB_CI_RUN: '32357666981'
      DB_GATE_RUN: '32357666957'
    steps:
      - name: Checkout PIE validation harness
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PIE
        run: python -m pip install -e .

      - name: Verify current BuildMap PR67 authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p calibration/input
          gh api "repos/${TARGET_REPO}/pulls/${TARGET_PR}" > calibration/input/pr67.json
          gh api --paginate "repos/${TARGET_REPO}/pulls/${TARGET_PR}/files?per_page=100" > calibration/input/pr67-files.json
          gh api "repos/${TARGET_REPO}/actions/runs/${WEB_CI_RUN}" > calibration/input/web-ci.json
          gh api "repos/${TARGET_REPO}/actions/runs/${DB_GATE_RUN}" > calibration/input/db-gate.json
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('calibration/input')
          pr=json.load(open(root/'pr67.json',encoding='utf-8'))
          files=json.load(open(root/'pr67-files.json',encoding='utf-8'))
          web=json.load(open(root/'web-ci.json',encoding='utf-8'))
          db=json.load(open(root/'db-gate.json',encoding='utf-8'))
          expected=[
            '.github/workflows/app-ci.yml',
            'apps/web/.env.example',
            'apps/web/app/api/integrations/figma/callback/route.ts',
            'apps/web/app/api/projects/[projectId]/integrations/figma/context/route.ts',
            'apps/web/app/projects/[projectId]/figma-capture-actions.ts',
            'apps/web/app/projects/[projectId]/figma-integration-actions.ts',
            'apps/web/app/projects/[projectId]/integration-actions.ts',
            'apps/web/app/projects/[projectId]/integrations/layout.tsx',
            'apps/web/components/buildmap/figma-context-preview.tsx',
            'apps/web/components/buildmap/figma-integration-notice.tsx',
            'apps/web/components/buildmap/figma-integration-section.tsx',
            'apps/web/lib/figma/api.ts',
            'apps/web/lib/figma/credential.ts',
            'apps/web/lib/figma/oauth.ts',
            'apps/web/lib/figma/provenance.ts',
            'apps/web/lib/figma/read.ts',
            'apps/web/lib/figma/resource.ts',
            'apps/web/package.json',
            'apps/web/scripts/phase52-figma-contract.mjs',
            'docs/access-policy-tests/phase52-figma-integration-foundation.md',
            'docs/decisions/phase52-figma-integration-foundation.md',
            'supabase/migrations/20260820190000_buildmap_21_figma_oauth_credentials.sql',
          ]
          actual=sorted(x['filename'] for x in files)
          assert pr['state']=='open', pr['state']
          assert pr['merged_at'] is None
          assert pr['base']['sha']==os.environ['TARGET_BASE'], (pr['base']['sha'], os.environ['TARGET_BASE'])
          assert pr['head']['sha']==os.environ['TARGET_HEAD'], (pr['head']['sha'], os.environ['TARGET_HEAD'])
          assert pr['changed_files']==22, pr['changed_files']
          assert actual==sorted(expected), actual
          for run,name in [(web,'Web App CI'),(db,'Database Contract Gate')]:
            assert run['head_sha']==os.environ['TARGET_HEAD'], (name,run['head_sha'])
            assert run['status']=='completed', (name,run['status'])
            assert run['conclusion']=='success', (name,run['conclusion'])
          (root/'changed-files.txt').write_text('\n'.join(expected)+'\n',encoding='utf-8')
          (root/'changed-files.json').write_text(json.dumps(expected,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Select review packs from official BuildMap profile
        shell: bash
        run: |
          set -euo pipefail
          urs select-packs profiles/examples/buildmap.yml \
            --files calibration/input/changed-files.txt \
            --json > calibration/selected-packs.json
          cat calibration/selected-packs.json

      - name: Create intentionally low declared Trust request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('calibration')
          files=json.load(open(root/'input/changed-files.json',encoding='utf-8'))
          readiness={
            'policy_id':'buildmap-pr67-corroboration-feasibility-v1',
            'policy_version':'1.0.0',
            'min_ledger_runs':1,
            'min_ledger_decisions':1,
            'min_defects':1,
            'min_closed_defects':0,
            'min_reground_observations':1,
            'min_reground_coverage':1.0,
            'min_reground_precision':1.0,
            'min_reground_recall':1.0,
            'max_reground_false_positive_rate':0.0,
            'require_active_policy':True,
            'require_pass_evaluation':True,
            'require_holdout':True,
            'require_repeatability':True,
            'require_zero_protected_negative_regressions':True,
          }
          request={
            'schema_version':'1.0',
            'task_id':'buildmap-pr67-corroboration-feasibility',
            'source_revision':'git:'+os.environ['TARGET_HEAD'],
            'task_class':'routine_code',
            'changed_files':files,
            'required_scenarios':['database_contract_gate','web_app_ci'],
            'completed_scenarios':['database_contract_gate','web_app_ci'],
            'repository_match':True,
            'head_match':True,
            'rollback_evidence':False,
            'replay_evidence':False,
            'readiness_policy':readiness,
          }
          (root/'trust-request.json').write_text(json.dumps(request,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run Trust classification and replay
        shell: bash
        run: |
          set -euo pipefail
          pie-trust assess \
            --request calibration/trust-request.json \
            --profile profiles/examples/buildmap.yml \
            --output calibration/trust-report.json \
            > calibration/assess.stdout.json
          pie-trust verify-report \
            --report calibration/trust-report.json \
            --request calibration/trust-request.json \
            --profile profiles/examples/buildmap.yml \
            > calibration/verify.stdout.json

      - name: Assert corroboration feasibility result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('calibration')
          report=json.load(open(root/'trust-report.json',encoding='utf-8'))
          packs=json.load(open(root/'selected-packs.json',encoding='utf-8'))
          risk=report['risk']
          advisory=report['task_advisory']
          assert risk['base_band']=='R2', risk
          assert risk['path_floor_band']=='R3', risk
          assert risk['effective_band']=='R3', risk
          assert advisory['review_requirement']=='HUMAN_APPROVAL_REQUIRED', advisory
          gates=set(advisory['triggered_hard_gates'])
          assert 'AUTHORIZATION_OR_MIGRATION_CHANGE' in gates, gates
          assert 'ROLLBACK_OR_REPLAY_EVIDENCE_MISSING' in gates, gates
          assert 'REQUIRED_SCENARIO_MISSING' not in gates, gates
          high=[x for x in risk['reasons'] if x['reason_id']=='HIGH_RISK_PATH']
          assert high and high[0]['band']=='R3', risk['reasons']
          high_paths=set(high[0]['paths'])
          assert '.github/workflows/app-ci.yml' in high_paths, high_paths
          assert 'apps/web/lib/figma/credential.ts' in high_paths, high_paths
          assert 'apps/web/lib/figma/oauth.ts' in high_paths, high_paths
          assert 'supabase/migrations/20260820190000_buildmap_21_figma_oauth_credentials.sql' in high_paths, high_paths
          selected=packs.get('selected_packs',[])
          result={
            'experiment':'BuildMap PR67 corroboration feasibility',
            'pie_main':'ea287d4d4c83d27b112c6161d4daa67840916437',
            'buildmap_pr':67,
            'buildmap_base':'d977d024f1dc6aadb016cf449492637464cf633b',
            'buildmap_head':'e7920f9436b293e8e40ca0be1d2eeb2697a58ea1',
            'declared_task_class':'routine_code',
            'base_band':risk['base_band'],
            'path_floor_band':risk['path_floor_band'],
            'effective_band':risk['effective_band'],
            'review_requirement':advisory['review_requirement'],
            'triggered_hard_gates':advisory['triggered_hard_gates'],
            'selected_packs':selected,
            'high_risk_paths':sorted(high_paths),
            'required_scenarios':['database_contract_gate','web_app_ci'],
            'completed_scenarios':['database_contract_gate','web_app_ci'],
            'readiness':report['readiness']['status'],
            'automation_authorized':report['automation_authorized'],
            'conclusion':'DETERMINISTIC_PATH_EVIDENCE_CORROBORATES_DECLARED_TASK_CLASS',
          }
          (root/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload corroboration evidence
        uses: actions/upload-artifact@v4
        with:
          name: buildmap-pr67-corroboration-feasibility
          path: calibration
          if-no-files-found: error

name: Stage 6 Hardening

on:
  push:
    branches:
      - agent/stage-6-evaluation-lab
    paths:
      - scripts/harden_stage6_evaluation.py
      - .github/workflows/stage6-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage6-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-6-evaluation-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair patch-script typo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/harden_stage6_evaluation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'design = design_path.read_text(encoding="utf-8")ndesign = ensure_replace(',
              'design = design_path.read_text(encoding="utf-8")\ndesign = ensure_replace(',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: python scripts/harden_stage6_evaluation.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_evaluation*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie-eval --help
      - run: pie --help
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/review_system/evaluation.py \
            src/review_system/application/evaluate_policy.py \
            src/review_system/evaluation_cli.py \
            tests/test_evaluation_hardening.py \
            docs/architecture/STAGE-6-EVALUATION-LAB.md
          git diff --cached --quiet || git commit -m "harden Evaluation Lab approval gates"
          git push origin HEAD:agent/stage-6-evaluation-lab

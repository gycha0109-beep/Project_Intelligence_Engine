name: Stage 2C Apply Verified

on:
  push:
    branches:
      - agent/stage-2c-repository-binding

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2c-repository-binding
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage2c_refactor.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/github_connector.py src/review_system/github/__init__.py docs/architecture/README.md
          git diff --cached --quiet || git commit -m "extract repository binding boundary"
          git push origin HEAD:agent/stage-2c-repository-binding

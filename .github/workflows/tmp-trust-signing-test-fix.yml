name: Temporary Trust Signing Test Fix

on:
  push:
    branches:
      - feat/trust-signing-trust-root-authority

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[trust-signing-tests-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale historical expectations and clean diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          semantic = "tests/test_trust_r4_semantic_authoritative_promotion.py"
          replace_once(
              semantic,
              'with self.assertRaisesRegex(ValueError, "requires Trust risk model v1.3 or v1.4"):',
              'with self.assertRaisesRegex(ValueError, "requires Trust risk model v1.3, v1.4 or v1.5"):',
          )
          replace_once(
              semantic,
              'self.assertEqual(report["risk_model_version"], "1.4")',
              'self.assertEqual(report["risk_model_version"], "1.5")',
          )

          verifier = "tests/test_trust_r4_verifier_role_authoritative_promotion.py"
          replace_once(
              verifier,
              '            v14_report = assess_trust(\n                fixture.request,\n                fixture.profile,\n                _risk_model_version=TRUST_RISK_MODEL_VERSION,\n',
              '            v14_report = assess_trust(\n                fixture.request,\n                fixture.profile,\n                _risk_model_version=TRUST_RISK_MODEL_V1_4,\n',
          )

          shadow = "tests/test_trust_r4_verifier_role_remediation_shadow.py"
          replace_once(
              shadow,
              '    TRUST_RISK_MODEL_V1_3,\n    TRUST_RISK_MODEL_VERSION,\n',
              '    TRUST_RISK_MODEL_V1_3,\n    TRUST_RISK_MODEL_V1_4,\n    TRUST_RISK_MODEL_VERSION,\n',
          )
          replace_once(
              shadow,
              '        self.assertEqual(TRUST_RISK_MODEL_V1_3, "1.3")\n        self.assertEqual(TRUST_RISK_MODEL_VERSION, "1.4")\n',
              '        self.assertEqual(TRUST_RISK_MODEL_V1_3, "1.3")\n        self.assertEqual(TRUST_RISK_MODEL_V1_4, "1.4")\n        self.assertEqual(TRUST_RISK_MODEL_VERSION, "1.5")\n',
          )
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f TRUST_SIGNING_DIAGNOSTIC.txt || true
          git rm -f .github/workflows/tmp-diagnose-trust-signing.yml || true
          git rm -f .github/workflows/tmp-trust-signing-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
                  tests/test_trust_r4_semantic_authoritative_promotion.py \
                  tests/test_trust_r4_verifier_role_authoritative_promotion.py \
                  tests/test_trust_r4_verifier_role_remediation_shadow.py
          git commit -m "test(trust): preserve v1.3-v1.4 replay under v1.5 [trust-signing-tests-fixed]"
          git push origin HEAD:feat/trust-signing-trust-root-authority

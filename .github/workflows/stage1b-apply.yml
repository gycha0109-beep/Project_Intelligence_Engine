name: Stage 1B Apply

on:
  push:
    branches:
      - agent/stage-1b-index-analyze-boundary
    paths:
      - scripts/apply_stage1b_refactor.py
      - .github/workflows/stage1b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-1b-index-analyze-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage1b_refactor.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee stage1b-unittest-output.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-unittest-diagnostics
          path: stage1b-unittest-output.txt
      - name: Commit verified CLI refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/cli.py
          git commit -m "extract index and analyze-change application boundaries"
          git push origin HEAD:agent/stage-1b-index-analyze-boundary

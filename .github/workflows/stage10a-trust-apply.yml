name: Stage 10A Trust Apply

on:
  push:
    branches:
      - agent/stage-10a-trust-gate-readiness
    paths:
      - scripts/apply_stage10a_trust_cli.py
      - .github/workflows/stage10a-trust-apply.yml

permissions:
  contents: write

concurrency:
  group: stage10a-trust-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-10a-trust-gate-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage10a_trust_cli.py
      - run: python scripts/sync_package_assets.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_trust_gate*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie trust-assess --help
      - run: pie validate-trust-report --help
      - run: pie-trust --help
      - run: pip wheel . --no-deps --wheel-dir dist-stage10a
      - name: Commit verified Trust integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/trust.py src/review_system/cli.py pyproject.toml src/review_system/assets/schemas
          git diff --cached --quiet || git commit -m "integrate report-only Trust readiness CLI"
          git push origin HEAD:agent/stage-10a-trust-gate-readiness

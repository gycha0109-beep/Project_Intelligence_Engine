name: Stage 3 Apply

on:
  push:
    branches:
      - agent/stage-3-run-artifact-identity
    paths:
      - scripts/apply_stage3_identity.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-3-run-artifact-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage3_identity.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/run.py src/review_system/application/analyze_pr.py
          git diff --cached --quiet || git commit -m "integrate run and artifact identity"
          git push origin HEAD:agent/stage-3-run-artifact-identity

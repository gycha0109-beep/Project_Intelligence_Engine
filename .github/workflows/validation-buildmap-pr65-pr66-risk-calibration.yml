name: Validation - BuildMap PR65 vs PR66 risk calibration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validation-buildmap-pr65-pr66-risk-calibration.yml"

permissions:
  contents: read
  pull-requests: read

env:
  BUILDMAP_REPO: gycha0109-beep/BuildMap
  PR65: "65"
  PR65_HEAD: 3d36bd7f64fd770c52f749836043b29390b05f77
  PR66: "66"
  PR66_HEAD: c67bf02ca406a31d844360e071ade25a94b5e211

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PIE validation harness
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PIE
        run: pip install -e .

      - name: Verify historical PR authority and changed files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p calibration/input calibration/pr65 calibration/pr66
          gh api "repos/${BUILDMAP_REPO}/pulls/${PR65}" > calibration/input/pr65.json
          gh api "repos/${BUILDMAP_REPO}/pulls/${PR66}" > calibration/input/pr66.json
          gh api --paginate "repos/${BUILDMAP_REPO}/pulls/${PR65}/files?per_page=100" --jq '.[].filename' > calibration/input/pr65-files.txt
          gh api --paginate "repos/${BUILDMAP_REPO}/pulls/${PR66}/files?per_page=100" --jq '.[].filename' > calibration/input/pr66-files.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('calibration/input')
          expected = {
              65: {
                  'head': os.environ['PR65_HEAD'],
                  'files': {
                      'apps/web/app/projects/[projectId]/github-integration-actions.ts',
                      'apps/web/lib/notion/api.ts',
                      'apps/web/lib/notion/resource.ts',
                      'docs/access-policy-tests/phase51-p3-integration-activation-readiness-controlled-live-e2e.md',
                      'docs/decisions/phase51-p3-integration-activation-readiness-controlled-live-e2e.md',
                  },
              },
              66: {
                  'head': os.environ['PR66_HEAD'],
                  'files': {'docs/handoff/ACTIVE-HANDOFF.md'},
              },
          }
          for n in (65, 66):
              pr = json.load(open(root/f'pr{n}.json', encoding='utf-8'))
              files = set((root/f'pr{n}-files.txt').read_text(encoding='utf-8').splitlines())
              assert pr['merged_at'] is not None
              assert pr['head']['sha'] == expected[n]['head'], (n, pr['head']['sha'])
              assert files == expected[n]['files'], (n, sorted(files))
              assert pr['changed_files'] == len(files), (n, pr['changed_files'], len(files))
          print('historical PR authority verified')
          PY

      - name: Checkout exact BuildMap PR heads
        shell: bash
        run: |
          set -euo pipefail
          for n in 65 66; do
            eval "head=\${PR${n}_HEAD}"
            git -C "calibration/pr${n}" init
            git -C "calibration/pr${n}" remote add origin "https://github.com/${BUILDMAP_REPO}.git"
            git -C "calibration/pr${n}" fetch --depth=1 origin "${head}"
            git -C "calibration/pr${n}" checkout --detach FETCH_HEAD
            test "$(git -C "calibration/pr${n}" rev-parse HEAD)" = "${head}"
            test -z "$(git -C "calibration/pr${n}" status --porcelain)"
          done

      - name: Index and analyze both historical changes with official BuildMap preset
        shell: bash
        run: |
          set -euo pipefail
          pie validate-profile profiles/examples/buildmap.yml
          pie validate-intelligence-config intelligence/examples/buildmap-config.yml
          for n in 65 66; do
            pie index-project profiles/examples/buildmap.yml \
              --config intelligence/examples/buildmap-config.yml \
              --repository-root "${GITHUB_WORKSPACE}/calibration/pr${n}" \
              --output "calibration/pr${n}/graph.json"
            pie analyze-change profiles/examples/buildmap.yml \
              --graph "calibration/pr${n}/graph.json" \
              --files "calibration/input/pr${n}-files.txt" \
              --repository-root "${GITHUB_WORKSPACE}/calibration/pr${n}" \
              --change-id "buildmap-pr${n}-retrospective" \
              --output "calibration/pr${n}/impact.json" \
              --markdown-output "calibration/pr${n}/impact.md"
          done

      - name: Create controlled Trust inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('calibration')
          policy = {
              'policy_id': 'buildmap-retrospective-calibration-v1',
              'policy_version': '1.0.0',
              'min_ledger_runs': 1,
              'min_ledger_decisions': 1,
              'min_defects': 1,
              'min_closed_defects': 0,
              'min_reground_observations': 1,
              'min_reground_coverage': 1.0,
              'min_reground_precision': 1.0,
              'min_reground_recall': 1.0,
              'max_reground_false_positive_rate': 0.0,
              'require_active_policy': True,
              'require_pass_evaluation': True,
              'require_holdout': True,
              'require_repeatability': True,
              'require_zero_protected_negative_regressions': True,
          }
          task_class = {65: 'routine_code', 66: 'documentation'}
          heads = {65: os.environ['PR65_HEAD'], 66: os.environ['PR66_HEAD']}
          for n in (65, 66):
              files = (root/'input'/f'pr{n}-files.txt').read_text(encoding='utf-8').splitlines()
              request = {
                  'schema_version': '1.0',
                  'task_id': f'buildmap-pr{n}-retrospective-calibration',
                  'source_revision': f'git:{heads[n]}',
                  'task_class': task_class[n],
                  'changed_files': files,
                  'required_scenarios': [],
                  'completed_scenarios': [],
                  'repository_match': True,
                  'head_match': True,
                  'rollback_evidence': False,
                  'replay_evidence': False,
                  'readiness_policy': policy,
              }
              json.dump(request, open(root/f'pr{n}'/'trust-request.json','w',encoding='utf-8'), indent=2)
          PY

      - name: Run PIE Trust risk classification and source replay
        shell: bash
        run: |
          set -euo pipefail
          for n in 65 66; do
            pie-trust assess \
              --request "calibration/pr${n}/trust-request.json" \
              --profile profiles/examples/buildmap.yml \
              --output "calibration/pr${n}/trust-report.json" \
              | tee "calibration/pr${n}/trust-assess.stdout.json"
            pie-trust verify-report \
              --report "calibration/pr${n}/trust-report.json" \
              --request "calibration/pr${n}/trust-request.json" \
              --profile profiles/examples/buildmap.yml \
              | tee "calibration/pr${n}/trust-verify.stdout.json"
          done

      - name: Assert graph coverage and write calibration result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('calibration')
          results = []
          for n in (65, 66):
              impact = json.load(open(root/f'pr{n}'/'impact.json', encoding='utf-8'))
              trust = json.load(open(root/f'pr{n}'/'trust-report.json', encoding='utf-8'))
              files = (root/'input'/f'pr{n}-files.txt').read_text(encoding='utf-8').splitlines()
              direct = impact.get('direct', {})
              missing = direct.get('files_missing_from_graph', [])
              in_graph = direct.get('files_in_graph', [])
              assert missing == [], (n, missing)
              if in_graph:
                  assert set(in_graph) == set(files), (n, in_graph, files)
              result = {
                  'pr': n,
                  'task_class': json.load(open(root/f'pr{n}'/'trust-request.json'))['task_class'],
                  'changed_files': files,
                  'changed_file_count': len(files),
                  'graph_files_in': len(in_graph) if in_graph else len(files),
                  'graph_files_missing': missing,
                  'selected_packs': impact['review']['selected_packs'],
                  'risk_band': trust['risk']['effective_band'],
                  'risk_reasons': trust['risk']['reasons'],
                  'review_requirement': trust['task_advisory']['review_requirement'],
                  'triggered_hard_gates': trust['task_advisory']['triggered_hard_gates'],
                  'readiness': trust['readiness']['status'],
                  'automation_authorized': trust['automation_authorized'],
              }
              results.append(result)
          payload = {
              'experiment': 'BuildMap PR65 vs PR66 retrospective risk calibration',
              'pie_main': 'ea287d4d4c83d27b112c6161d4daa67840916437',
              'calibration_target': ['risk_band', 'review_requirement', 'selected_packs', 'graph_coverage'],
              'readiness_is_not_calibration_target': True,
              'results': results,
          }
          json.dump(payload, open(root/'RESULT.json','w',encoding='utf-8'), indent=2)
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildmap-pr65-pr66-risk-calibration
          path: calibration/
          if-no-files-found: error

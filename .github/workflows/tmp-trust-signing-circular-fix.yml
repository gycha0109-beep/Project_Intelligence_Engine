name: Temporary Trust Signing Circular Import Fix

on:
  push:
    branches:
      - feat/trust-signing-trust-root-authority

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[trust-signing-circular-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove authority-to-shadow import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/review_system/trust_signing_trust_root_authority.py")
          text = p.read_text(encoding="utf-8")
          old = "from .trust_signing_trust_root_shadow import analyze_signing_trust_root_candidate\n"
          new = "from .trust_signing_trust_root_semantics import analyze_signing_trust_root_semantics\n"
          if text.count(old) != 1:
              raise SystemExit("authority import target mismatch")
          text = text.replace(old, new, 1)
          old_call = "    candidate = analyze_signing_trust_root_candidate(path, patch)\n"
          new_call = "    candidate = analyze_signing_trust_root_semantics(path, patch)\n"
          if text.count(old_call) != 1:
              raise SystemExit("authority analyzer call target mismatch")
          p.write_text(text.replace(old_call, new_call, 1), encoding="utf-8")
          PY
          git rm .github/workflows/tmp-trust-signing-circular-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/review_system/trust_signing_trust_root_authority.py
          git commit -m "fix(trust): remove signing authority circular import [trust-signing-circular-fixed]"
          git push origin HEAD:feat/trust-signing-trust-root-authority

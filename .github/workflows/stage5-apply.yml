name: Stage 5 Apply

on:
  push:
    branches:
      - agent/stage-5-defect-registry
    paths:
      - scripts/apply_stage5_defect_registry.py
      - scripts/fix_stage5_event_hash.py
      - .github/workflows/stage5-apply.yml
      - docs/architecture/.stage5-apply-trigger
  pull_request:
    branches:
      - agent/stage-4-evidence-ledger-foundation
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-5-defect-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_stage5_defect_registry.py
      - run: python scripts/fix_stage5_event_hash.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_defects.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie-defect --help
      - run: pie-ledger --help
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/review_system/ledger.py \
            src/review_system/ledger_cli.py \
            src/review_system/defects.py \
            tests/test_defects.py \
            pyproject.toml \
            docs/architecture/README.md
          git diff --cached --quiet || git commit -m "integrate Defect Registry with Evidence Ledger"
          git push origin HEAD:agent/stage-5-defect-registry

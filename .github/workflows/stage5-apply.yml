name: Stage 5 Apply

on:
  push:
    branches:
      - agent/stage-5-defect-registry
    paths:
      - scripts/harden_stage5_defect_registry.py
      - .github/workflows/stage5-apply.yml
      - docs/architecture/.stage5-hardening-trigger

permissions:
  contents: write

concurrency:
  group: stage5-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-5-defect-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/harden_stage5_defect_registry.py
      - run: pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_defect*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: pie-defect --help
      - run: pie-ledger --help
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/review_system/defects.py \
            src/review_system/ledger.py \
            tests/test_defect_registry_hardening.py
          git diff --cached --quiet || git commit -m "harden Defect Registry invariants"
          git push origin HEAD:agent/stage-5-defect-registry

schema_version: "1.0"
graph:
  max_file_size_bytes: 1000000
components:
  - id: application
    name: Application
    paths: ["src/**", "app/**"]
  - id: database
    name: Database
    paths: ["supabase/**", "migrations/**", "database/**"]
  - id: tests
    name: Tests
    paths: ["tests/**", "test/**", "__tests__/**"]
  - id: documentation
    name: Documentation
    paths: ["docs/**", "**/*.md"]

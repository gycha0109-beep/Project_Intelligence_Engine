schema_version: "1.0"
graph:
  max_file_size_bytes: 1000000
components:
  - id: decision-timeline
    name: Decision Timeline
    paths: ["src/**/decision*/**", "src/**/timeline*/**", "apps/web/app/projects/*/decision-actions.ts", "apps/web/app/projects/*/decisions/**", "apps/web/components/buildmap/*decision*", "docs/**/decision*", "docs/**/timeline*"]
  - id: change-card
    name: Change Card and Review
    paths: ["src/**/change*card*/**", "src/**/review*/**", "apps/web/app/projects/*/workspace/review/**"]
  - id: public-feedback
    name: Public Project and Feedback
    paths: ["src/**/public*/**", "src/**/feedback*/**", "apps/web/app/projects/*/feedback-actions.ts", "apps/web/app/projects/*/feedback/**"]
  - id: database-security
    name: Supabase Database and Security
    paths: ["supabase/migrations/**", "supabase/tests/**", "supabase/functions/**"]
  - id: verification
    name: Scripts and Tests
    paths: ["scripts/**", "tests/**"]

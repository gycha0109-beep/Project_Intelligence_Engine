[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-intelligence-engine"
version = "0.3.0"
description = "Project-aware change intelligence and evidence-driven review framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PyYAML>=6.0.3",
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
pie = "review_system.cli:main"
urs = "review_system.cli:main"
pie-ledger = "review_system.ledger_cli:main"
pie-defect = "review_system.defect_cli:main"
pie-eval = "review_system.evaluation_cli:main"
pie-policy = "review_system.policy_cli:main"
pie-policy-match-explain = "review_system.operational_policy_match_explanation_cli:main"
pie-policy-selector-overlap = "review_system.operational_policy_selector_overlap_cli:main"
pie-reground = "review_system.reground_cli:main"
pie-buildmap = "review_system.buildmap_cli:main"
pie-trust = "review_system.trust_cli:main"
pie-trust-comparison = "review_system.trust_comparison_cli:main"
pie-trust-audit = "review_system.trust_audit_cli:main"
pie-trust-observation = "review_system.trust_observation_cli:main"
pie-trust-reconciliation = "review_system.trust_reconciliation_cli:main"
pie-trust-pilot-review = "review_system.trust_pilot_review_cli:main"
pie-trust-pilot-evidence = "review_system.trust_pilot_evidence_run_cli:main"
pie-trust-evidence-acquisition = "review_system.trust_evidence_acquisition_cli:main"
pie-trust-prospective = "review_system.trust_prospective_evidence_cli:main"
pie-trust-campaign-aggregate = "review_system.prospective_campaign_aggregator_cli:main"
pie-trust-campaign-project = "review_system.prospective_campaign_projection_cli:main"
pie-trust-campaign-events = "review_system.prospective_campaign_event_projection_cli:main"
pie-calibration-backfill = "review_system.calibration_backfill_cli:main"
pie-calibration-trust-gap = "review_system.calibration_trust_gap_cli:main"
pie-calibration-policy-ambiguity = "review_system.calibration_policy_ambiguity_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_system = ["assets/**/*", "assets/**/**/*", "assets/**/**/**/*", "assets/**/**/**/**/*"]
